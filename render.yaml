# Render Blueprint for a monorepo: this repo also has the HomeNest frontend at its
# root, so this backend service is anchored to the backend/ subfolder via rootDir.
# On Render: New + -> Blueprint -> pick this repo -> Apply.
databases:
  - name: homenest-db
    plan: free
    databaseName: homenest
    user: homenest

services:
  - type: web
    name: homenest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homenest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
